<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>RAG Health AI — History</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
.reports-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:1rem}
.report-card{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--border);border-radius:var(--radius);padding:1.4rem;cursor:pointer;transition:all 0.2s;animation:fadeUp 0.4s ease both}
.report-card.good{border-top-color:var(--green)}.report-card.warn{border-top-color:var(--warn)}.report-card.bad{border-top-color:var(--red)}
.report-card:hover{transform:translateY(-3px);border-color:var(--border2);box-shadow:var(--shadow)}
.report-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:0.85rem}
.report-icon{width:38px;height:38px;background:var(--bg3);border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:1.2rem}
.report-score{font-family:'Syne',sans-serif;font-size:1.4rem;font-weight:800;line-height:1}
.report-score-label{font-size:0.68rem;color:var(--text3)}
.score-good{color:var(--green)}.score-warn{color:var(--warn)}.score-bad{color:var(--red)}
.report-name{font-weight:600;font-size:0.88rem;margin-bottom:0.2rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.report-date{font-size:0.76rem;color:var(--text2)}
.report-footer{display:flex;align-items:center;justify-content:space-between;margin-top:0.85rem;padding-top:0.85rem;border-top:1px solid var(--border)}
.report-meta{font-size:0.75rem;color:var(--text2)}
.empty-state{text-align:center;padding:5rem 2rem;color:var(--text2)}
.empty-icon{font-size:2.5rem;margin-bottom:1rem}
.empty-state h2{font-family:'Syne',sans-serif;font-size:1.2rem;margin-bottom:0.4rem;color:var(--text)}
.loading-state{text-align:center;padding:4rem;color:var(--text2)}
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo"><span class="nav-dot"></span>RAG Health AI</a>
  <div class="nav-links"><a href="index.html">Upload</a><a href="dashboard.html">Dashboard</a><a href="history.html" class="active">History</a><a href="trends.html">Trends</a></div>
  <div class="nav-user" id="navUser" style="display:none"><span id="navUserName"></span><button class="btn btn-danger" style="padding:4px 12px;font-size:0.78rem" onclick="logout()">Logout</button></div>
</nav>
<main>
  <div class="disclaimer fade-up">⚠ For informational purposes only. Always consult a qualified doctor.</div>
  <div class="fade-up" style="margin-bottom:1.5rem"><div class="section-label">All Reports</div><div class="section-title">Report History</div></div>
  <div id="loadingState" class="loading-state"><div class="spinner" style="width:28px;height:28px;margin:0 auto 1rem"></div><p>Loading reports...</p></div>
  <div id="emptyState" class="empty-state" style="display:none">
    <div class="empty-icon">📋</div>
    <h2>No reports yet</h2>
    <p style="margin-bottom:1.2rem">Upload your first health report to get started.</p>
    <a href="index.html" class="btn btn-primary">Upload Report</a>
  </div>
  <div class="reports-grid" id="reportsGrid"></div>
</main>
<div class="toast" id="toast"></div>
<script src="js/auth.js"></script>
<script src="js/history.js"></script>
</body>
</html>
