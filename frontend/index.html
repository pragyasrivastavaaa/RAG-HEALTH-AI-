<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/><meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>RAG Health AI — Upload Report</title>
<link rel="stylesheet" href="css/style.css"/>
<style>
.drop-area { border: 2px dashed var(--border2); border-radius: var(--radius); padding: 3.5rem 2rem; text-align: center; transition: all 0.3s; cursor: pointer; background: var(--bg3); margin-bottom: 1.5rem; }
.drop-area.dragging { border-color: var(--accent); background: rgba(0, 212, 170, 0.05); }
.drop-area:hover { border-color: var(--accent); }
.drop-icon { font-size: 2.5rem; color: var(--accent); margin-bottom: 1rem; }
.drop-title { font-family: 'Syne', sans-serif; font-size: 1.1rem; font-weight: 700; margin-bottom: 0.5rem; }
.drop-desc { color: var(--text2); font-size: 0.85rem; }
.file-selected { display: none; align-items: center; justify-content: space-between; background: var(--card); border: 1px solid var(--border); border-radius: var(--rsm); padding: 1rem 1.2rem; margin-bottom: 1.5rem; }
.file-selected.show { display: flex; animation: fadeUp 0.3s ease; }
.file-info { display: flex; align-items: center; gap: 12px; }
.file-name { font-weight: 600; font-size: 0.95rem; margin-bottom: 3px; }
.file-size { color: var(--text2); font-size: 0.8rem; }
.file-remove { background: rgba(255, 77, 109, 0.1); color: var(--red); border: none; border-radius: 6px; width: 28px; height: 28px; cursor: pointer; transition: background 0.2s; display: flex; align-items: center; justify-content: center; }
.file-remove:hover { background: rgba(255, 77, 109, 0.2); }
.progress-wrap { display: none; margin-top: 1.8rem; }
.progress-wrap.show { display: block; animation: fadeUp 0.3s ease; }
.progress-bar { height: 6px; background: var(--bg3); border-radius: 3px; overflow: hidden; margin-bottom: 0.6rem; }
.progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s ease; }
.progress-label { font-size: 0.85rem; color: var(--text2); text-align: center; display: block; font-weight: 500; }
.upload-card { max-width: 580px; margin: 2rem auto; padding: 2.5rem; }
</style>
</head>
<body>
<nav>
  <a href="index.html" class="nav-logo"><span class="nav-dot"></span>RAG Health AI</a>
  <div class="nav-links"><a href="index.html" class="active">Upload</a><a href="dashboard.html">Dashboard</a><a href="history.html">History</a><a href="trends.html">Trends</a></div>
  <div class="nav-user" id="navUser" style="display:none"><span id="navUserName"></span><button class="btn btn-danger" style="padding:4px 12px;font-size:0.78rem" onclick="logout()">Logout</button></div>
</nav>
<main>
  <div class="card upload-card fade-up">
    <div style="text-align:center; margin-bottom:2.2rem;">
      <h1 style="font-family:'Syne', sans-serif; font-size:1.8rem; margin-bottom:0.6rem;">Upload Lab Report</h1>
      <p style="color:var(--text2); font-size:0.9rem;">Upload your blood test report (PDF or Image) for AI-powered analysis.</p>
    </div>
    
    <input type="file" id="fileInput" accept=".pdf,image/*" style="display:none"/>
    
    <div class="drop-area" id="dropArea" onclick="document.getElementById('fileInput').click()">
      <div class="drop-icon">📄</div>
      <div class="drop-title">Drag & Drop your report here</div>
      <div class="drop-desc">or click to browse from your device</div>
    </div>

    <div class="file-selected" id="fileSelected">
      <div class="file-info">
        <div style="font-size:1.5rem">📄</div>
        <div>
          <div class="file-name" id="fileName">report.pdf</div>
          <div class="file-size" id="fileSize">1.2 MB</div>
        </div>
      </div>
      <button type="button" class="file-remove" id="fileRemove" style="border:none;background:none;cursor:pointer;">✕</button>
    </div>

    <button type="button" class="btn btn-primary" id="uploadBtn" style="width:100%; padding:0.95rem; font-size:0.95rem; font-weight:600;" disabled>
      <span id="btnText">Select a file to analyse</span>
    </button>

    <div class="progress-wrap" id="progressWrap">
      <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
      <span class="progress-label" id="progressLabel">Analysing...</span>
    </div>
  </div>
</main>
<script src="js/auth.js"></script>
<script>renderNavUser();</script>
<script src="js/upload.js"></script>
</body>
</html>
